services:
  node1:
    build: .
    image: thunk
    hostname: node1
    ports:
      - "4000:4000"
    environment:
      THUNK_NODE: thunk
      THUNK_COOKIE: thunk-demo
      THUNK_PEERS: thunk@node2,thunk@node3
  node2:
    build: .
    image: thunk
    hostname: node2
    environment:
      THUNK_NODE: thunk
      THUNK_COOKIE: thunk-demo
      THUNK_PEERS: thunk@node1,thunk@node3
  node3:
    build: .
    image: thunk
    hostname: node3
    environment:
      THUNK_NODE: thunk
      THUNK_COOKIE: thunk-demo
      THUNK_PEERS: thunk@node1,thunk@node2
  # Replicas use their container id as hostname.
  joiner:
    image: thunk
    profiles: [join]
    depends_on: [node1]
    environment:
      THUNK_NODE: thunk
      THUNK_COOKIE: thunk-demo
      THUNK_PEERS: thunk@node1
